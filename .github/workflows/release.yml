name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Valider et empaqueter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # jq est préinstallé sur l'image du runner : on vérifie, on n'installe pas.
      - name: Vérifier les prérequis
        run: |
          command -v jq >/dev/null || { echo "jq absent de l'image du runner"; exit 1; }
          jq --version
      - name: Vérifier la version du tag
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - name: Valider le JSON des règles
        run: jq empty skills/green-claude/rules/*.json skills/green-claude/rules/langages/*.json
      - name: Lancer les tests de version
        run: bash scripts/test-release-version.sh
      - name: Lancer les tests de l'audit
        run: bash skills/green-claude/scripts/test-eco-audit.sh
      - name: Lancer les tests du cache
        run: bash hooks/test-cache.sh
      - name: Construire les archives
        run: bash skills/green-claude/scripts/package-skill.sh
      - name: Vérifier les archives
        run: |
          unzip -t dist/green-claude-claude-ai.zip
          unzip -t dist/green-claude-api.zip
      - name: Transmettre les archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/green-claude-claude-ai.zip
            dist/green-claude-api.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publier la release GitHub
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Récupérer les archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/green-claude-claude-ai.zip \
            dist/green-claude-api.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Green Claude $GITHUB_REF_NAME"
