  - ai
  - sustainability
  - eco-design
  - digital-sobriety
  - responsible-ai
  - green-it
  - carbon-aware
  - energy-efficient
  - water-aware

# Standards compliance for technical search
standards:
  - RGESN 2024
  - GR491
  - Green Software Foundation
  - W3C Web Sustainability Guidelines

# Features for feature-based search
features:
  - eco-design rules: 107
  - ai specific rules: 23
  - language rules: 127
  - supported languages and frameworks: 24
  - automatic detection: true
  - claude code integration: true
  - security scanning: true
  - push protection: true
