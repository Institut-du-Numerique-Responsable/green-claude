# Editorial discovery inventory for maintainers.
# GitHub does not read this file as search configuration. Set the repository
# description, homepage and topics through GitHub Settings or its API.

# Repository name for search indexing
name: green-claude

# Description for search engines (160 characters max for Google snippet)
description: "Eco-design skill for Claude Code: digital sobriety, RGESN/GR491 compliance, AI responsibility, water/electricity/CPU/GPU optimization"

# Keywords for search indexing (comma-separated, max 255 characters)
keywords: >
  ai,eco-design,digital sobriety,sustainable software,green it,gr491,rgesn,claude code,eco-conception,frugal ai

# Topics for GitHub discovery (max 50)
topics: [
  ai,
  carbon-footprint,
  claude,
  claude-code,
  claude-code-plugin,
  eco-conception,
  eco-design,
  frugal-ai,
  gr491,
  green-coding,
  green-it,
  green-software,
  numerique-responsable,
  rgesn,
  sobriete-numerique,
  sustainability,
  sustainable-software,
  web-sustainability,
  eco-responsable,
  digital-sobriety,
  energy-efficiency,
  water-usage,
  cpu-optimization,
  gpu-optimization
]

# Author information for search attribution
author:
  name: Institut du Numérique Responsable
  email: contact@institutnr.org
  url: https://institutnr.org

# License for search indexing
license: MIT

# Homepage for search results
homepage: https://institut-du-numerique-responsable.github.io/green-claude/

# Repository URL (canonical)
repository: https://github.com/Institut-du-Numerique-Responsable/green-claude

# Maintainer references
maintainers:
  - name: Guillaume Gallon
    github: gridboy
    email: guillaume.gallon@gmail.com
  - name: Robin Trassard
    github: robintra
  - name: Guillaume Bourgeois
    github: bourgeoisguillaume01-glitch
  - name: Vincent Courboulay
    github: vcourbou

# Languages for language-specific search
languages: [en, fr]

# Primary language
default_language: en

# Tags for specialized search (AI, sustainability, etc.)
