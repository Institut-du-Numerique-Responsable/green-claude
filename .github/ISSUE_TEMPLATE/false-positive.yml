name: Faux positif
description: Signaler une règle déclenchée sur du code déjà conforme.
title: "[Faux positif] "
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Identifiant de règle
      placeholder: ECO-FRONT-01
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Exemple minimal
      description: Code minimal déclenchant le résultat.
      render: text
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Résultat observé et attendu
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions et environnement
      description: Green Claude, OS, Bash et jq.
    validations:
      required: true
